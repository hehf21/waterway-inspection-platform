# ============================================================
# 水路运输检查平台 · Nginx 反向代理 + HTTPS 样例（部署环境用）
# 用法：证书放 /etc/nginx/certs/，替换 server_name 后启用本配置
# ============================================================
server {
    listen 80;
    server_name slys.example.gov.cn;          # ← 改为实际域名/IP
    return 301 https://$host$request_uri;     # 强制跳 HTTPS
}

server {
    listen 443 ssl;
    server_name slys.example.gov.cn;          # ← 改为实际域名/IP

    ssl_certificate     /etc/nginx/certs/slys.crt;
    ssl_certificate_key /etc/nginx/certs/slys.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 安全响应头（应用层已带一份，代理层可再加；CSP 由应用按请求 nonce 下发，勿在此覆盖）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 60m;                 # 略大于单件上传上限 50MB

    location / {
        proxy_pass         http://127.0.0.1:8098;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;              # 打包/导出耗时操作
    }
}
